<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AURA Boutique - Catálogo</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
</head>
<body>

    <!-- Encabezado con marca centrada -->
    <header>
        <div class="header-top">
            <div class="logo-container">
                <h1 class="logo">AURA</h1>
                <p class="slogan">BOUTIQUE</p>
                <p class="slogan-secundario">TU LUZ, TU ESTILO, TU ESENCIA</p>
            </div>
            
            <!-- Botón flotante del Carrito -->
            <button id="cart-btn" class="cart-icon-btn">
                🛒 Carrito (<span id="cart-count">0</span>)
            </button>
        </div>
    </header>

    <!-- Navegación: Búsqueda y Categorías -->
    <nav class="nav-container">
        <input type="search" id="search-input" placeholder="Buscar prendas exclusivas..." class="search-bar">
        
        <div class="categories-container" id="categories-container">
            <button class="category-btn active" data-category="todos">Todos</button>
            <button class="category-btn" data-category="faldas">Faldas</button>
            <button class="category-btn" data-category="blusas">Blusas</button>
            <button class="category-btn" data-category="vestidos">Vestidos</button>
        </div>
    </nav>

    <!-- Contenedor de Productos -->
    <main id="products-container" class="products-grid"></main>

    <!-- Barra Lateral del Carrito -->
    <div id="cart-sidebar" class="cart-sidebar">
        <div class="cart-header">
            <h2>Tu Carrito</h2>
            <button id="close-cart" class="close-btn">&times;</button>
        </div>
        <div id="cart-items" class="cart-items">
            <p class="empty-msg">El carrito está vacío</p>
        </div>
        <div class="cart-footer">
            <div class="cart-total">
                <span>Total:</span>
                <span id="cart-total-price">S/ 0.00</span>
            </div>
            <button id="whatsapp-checkout-btn" class="whatsapp-btn">
                Pedir por WhatsApp 📱
            </button>
        </div>
    </div>

    <!-- Fondo Oscuro del Carrito -->
    <div id="cart-overlay" class="cart-overlay"></div>

    <script src="script.js" defer></script>
</body>
</html>
